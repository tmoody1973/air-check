# Run from the repo root on the VM:
#   docker compose --env-file ${HOME}/.aircheck/console.env -f deploy/compose.yaml up -d --build
# --env-file feeds the build args below; the console service reads the same file at runtime.
services:
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    image: aircheck-console:local
    env_file: ${HOME}/.aircheck/console.env
    # No `ports`: Docker publishes bypass ufw. Only caddy is reachable from outside.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /app/apps/console/.next/cache:uid=1000,gid=1000,mode=0700
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      # node:24-slim has no curl.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      console:
        condition: service_healthy
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
