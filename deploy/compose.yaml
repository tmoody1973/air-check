# Run from the repo root on the VM:
#   docker compose --env-file ${HOME}/.aircheck/console.env -f deploy/compose.yaml up -d --build
# --env-file feeds the build args below; the console service reads the same file at runtime.
services:
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?set in ~/.aircheck/console.env}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set in ~/.aircheck/console.env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set in ~/.aircheck/console.env}
    image: aircheck-console:local
    env_file: ${HOME}/.aircheck/console.env
    # No `ports`: Docker publishes bypass ufw. Only caddy is reachable from outside.
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /app/apps/console/.next/cache:uid=1000,gid=1000,mode=0700
      - /tmp
    # The only writable host paths: Connect Mixcloud writes token.json for the publisher, and Connect Google Drive /
    # Connect Dropbox write google.json / dropbox.json for the ingest service (docs/DEPLOY.md, the token folders).
    # Prepared show MP3s are read-only, for the package page's player.
    volumes:
      - ${HOME}/.aircheck/mixcloud:/mixcloud:rw
      - ${HOME}/.aircheck/ingest-tokens:/ingest-tokens:rw
      - ${HOME}/aircheck-audio/prepared:/audio:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 256
    healthcheck:
      # node:24-slim has no curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sign-in').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # Left running as root on purpose: switching to a non-root user would need a file
    # capability to bind ports 80 and 443, and no-new-privileges blocks that. Every
    # capability except NET_BIND_SERVICE is dropped instead.
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      console:
        condition: service_healthy
    networks: [internal]

networks:
  internal: {}

volumes:
  caddy_data: {}
  caddy_config: {}
