# Modified for Air Check (2026-10-27): the /extract rule is removed so the agent can search
# with Tavily but cannot have Tavily fetch an arbitrary page (Hard Rule 5, decision 006).

preset:
  name: tavily-search-only
  description: "Tavily web search only, no page extract (Air Check)"

network_policies:
  tavily-search-only:
    name: tavily-search-only
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        # Hermes sends the resolver placeholder as the JSON `api_key` field.
        request_body_credential_rewrite: true
        rules:
          - allow: { method: POST, path: "/search" }
    binaries:
      # Agent runtimes: Deep Agents Code's managed Python (including versioned
      # python3 names), Hermes' exact venv Python, and OpenClaw's Node paths.
      - { path: /opt/venv/bin/python3* }
      - { path: /opt/hermes/.venv/bin/python }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      # Exact curl paths are used only by onboarding's post-create verifier;
      # requests remain constrained by the single POST /search rule above.
      - { path: /usr/local/bin/curl }
      - { path: /usr/bin/curl }
